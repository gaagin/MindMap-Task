<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vibrant Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Glow for Central Core -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Crisp Soft Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
    
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Subtle Lighting Overlay -->
  <rect width="512" height="256" fill="url(#glossGrad)" />

  <!-- MindFlow Central Network Symbol (Scaled for Safe-Zone) -->
  <g transform="translate(46, 46) scale(0.82)" filter="url(#softShadow)">
    <!-- Interconnecting Flow Arcs -->
    <path d="M 256 256 C 210 200 170 170 148 170 C 115 170 95 195 95 230 C 95 275 140 310 256 256" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" />
    <path d="M 256 256 C 302 312 342 342 364 342 C 397 342 417 317 417 282 C 417 237 372 202 256 256" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" />
    
    <!-- Secondary Branching Lines -->
    <path d="M 256 256 L 360 145" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round" />
    <path d="M 256 256 L 152 367" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round" />
    
    <!-- Top-Right Smart Node -->
    <g filter="url(#nodeGlow)">
      <circle cx="360" cy="145" r="32" fill="#FFFFFF" />
      <circle cx="360" cy="145" r="18" fill="#3B82F6" />
      <circle cx="360" cy="145" r="8" fill="#FFFFFF" />
    </g>

    <!-- Bottom-Left Task Node with Checkmark -->
    <g filter="url(#nodeGlow)">
      <rect x="122" y="337" width="60" height="60" rx="18" fill="#FFFFFF" />
      <path d="M 137 367 L 148 378 L 167 357" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Left Flow Node -->
    <circle cx="100" cy="225" r="14" fill="#FFFFFF" />
    <circle cx="100" cy="225" r="7" fill="#6366F1" />

    <!-- Right Flow Node -->
    <circle cx="412" cy="287" r="14" fill="#FFFFFF" />
    <circle cx="412" cy="287" r="7" fill="#0EA5E9" />

    <!-- Center Core Node (Mind Hub) -->
    <g filter="url(#nodeGlow)">
      <circle cx="256" cy="256" r="54" fill="url(#coreGrad)" />
      <circle cx="256" cy="256" r="34" fill="#4F46E5" />
      <!-- Sparkle in center -->
      <path d="M 256 238 C 256 248 248 256 238 256 C 248 256 256 264 256 274 C 256 264 264 256 274 256 C 264 256 256 248 256 238 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
